          <text class="p-sans" y="24" font-size="12" fill="#88B99A">RBAC Auth Security</text>
        </g>
        <g transform="translate(276, 264)">
          <text class="p-heading" font-size="32" fill="#E6FFF0">High Uptime</text>
          <text class="p-sans" y="24" font-size="12" fill="#88B99A">Resilient Backend</text>
        </g>
        <g transform="translate(496, 264)">
          <text class="p-heading" font-size="32" fill="#E6FFF0">Full-Stack</text>
          <text class="p-sans" y="24" font-size="12" fill="#88B99A">MERN Architecture</text>
        </g>

