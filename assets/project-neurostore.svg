    <rect width="1120" height="340" rx="16" fill="url(#p-bg-03)" stroke="#00FF66" stroke-width="1.2" stroke-opacity="0.3"/>
    <rect width="1120" height="340" rx="16" fill="url(#p-glow-03)"/>
    <rect class="p-trace" width="1120" height="340" rx="16" fill="none" stroke="url(#p-trace-03)" stroke-width="1.4"/>

    <!-- Category Monospace Tag -->
    <text class="p-mono" x="56" y="58" font-size="11.5" font-weight="700" letter-spacing="2.6" fill="#00FF66">03 · FULL-STACK · E-COMMERCE ARCHITECTURE</text>

    <!-- Main Title -->
    <text class="p-heading" x="54" y="112" font-size="44" letter-spacing="-1" fill="#E6FFF0">NeuroStore MERN Platform</text>

    <!-- Description -->
    <text class="p-sans" x="56" y="148" font-size="16" fill="#88B99A">High-concurrency e-commerce architecture with multi-level JWT RBAC and payment state machine.</text>

    <!-- Built Highlight Line -->
    <text class="p-mono" x="56" y="184" font-size="12.5" fill="#E6FFF0">
      <tspan fill="#05FFA1" font-weight="700">BUILT › </tspan>isolated tenant catalog › stateful cart &amp; order lifecycle › responsive React client
    </text>

    <!-- Key Metrics -->
    
        <g transform="translate(56, 264)">
