<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p03-t">
  <title id="p03-t">NEURO//NODE Interface: Local-first cyberpunk personal dashboard &amp; digital command center with offline matrix clusters.</title>
  <defs>
    <linearGradient id="p03-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041207"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="p03-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#00FF66" stop-opacity=".45"/>
      <stop offset="1" stop-color="#00240E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p03-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#00FF66" stroke-opacity=".07"/>
    </pattern>
    <filter id="p03-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p03-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p03-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6FFF0"/><stop offset=".45" stop-color="#00FF66"/><stop offset="1" stop-color="#00FF66" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p-in { animation: p-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p-d1 { animation-delay: .15s; } .p-d2 { animation-delay: .4s; }
    .p-chip { animation: p-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p-chip { from { opacity: 0.85; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .p-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p-in { from { opacity: 0.85; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes p-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p-in, .p-chip { animation: none; } .p-draw { animation: none; stroke-dashoffset: 0; } }
    .p-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p-trace 7s linear infinite; }
    @keyframes p-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p-trace { display: none; } }
  </style>
  <g clip-path="url(#p03-clip)">
    <rect width="1200" height="370" fill="url(#p03-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p03-grid)"/>
    <rect width="1200" height="370" fill="url(#p03-glow)"/>
    
    <!-- Left Column Content -->
    <g class="p-in p-d1">
      <text class="p-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#00FF66">03 · LOCAL-FIRST · DIGITAL COMMAND CENTER</text>
      <text class="p-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#E6FFF0">NEURO//NODE Interface</text>
      <text class="p-sans" x="56" y="166" font-size="17" fill="#88B99A">Local-first cyberpunk personal dashboard &amp; digital command center with offline matrix clusters.</text>
      <text class="p-mono" x="56" y="200" font-size="12.5" fill="#E6FFF0"><tspan fill="#00FF66">BUILT ›</tspan> 0ms local UI latency › privacy-first data sovereignty › modular matrix clusters</text>
      <line class="p-draw" x1="56" y1="226" x2="680" y2="226" stroke="#00FF66" stroke-opacity=".3"/>
      
      <!-- 3 Metrics Columns -->
      <g transform="translate(56 266)">
        <text class="p-serif" font-size="34" font-weight="300" fill="#E6FFF0">0ms Latency</text>
        <text class="p-sans" y="24" font-size="12.5" fill="#88B99A">Local-First UI</text>
      </g>
      <g transform="translate(261 266)">
        <text class="p-serif" font-size="34" font-weight="300" fill="#E6FFF0">100% Offline</text>
        <text class="p-sans" y="24" font-size="12.5" fill="#88B99A">True Independence</text>
      </g>
      <g transform="translate(466 266)">
        <text class="p-serif" font-size="34" font-weight="300" fill="#E6FFF0">Modern</text>
        <text class="p-sans" y="24" font-size="12.5" fill="#88B99A">Cyberpunk HUD</text>
      </g>
      
      <!-- Tech Badge Chips -->
      <g class="p-chip" style="animation-delay:1.00s">
        <rect x="56" y="314" width="104" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="108.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">TypeScript</text>
      </g>
      <g class="p-chip" style="animation-delay:1.12s">
        <rect x="170" y="314" width="64" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="202.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">React</text>
      </g>
      <g class="p-chip" style="animation-delay:1.24s">
        <rect x="244" y="314" width="120" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="304.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">Tailwind CSS</text>
      </g>
      <g class="p-chip" style="animation-delay:1.36s">
        <rect x="374" y="314" width="56" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="402.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">Vite</text>
      </g>
      <g class="p-chip" style="animation-delay:1.48s">
        <rect x="440" y="314" width="72" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="476.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">Docker</text>
      </g>
      <g class="p-chip" style="animation-delay:1.60s">
        <rect x="522" y="314" width="80" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="562.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">Node.js</text>
      </g>
    </g>
    
    <!-- Right Column Illustration -->
    <g class="p-in p-d2">
      <g transform="translate(800 42)">
        <!-- Cyber Command Center Dashboard -->
        <rect width="340" height="230" rx="12" fill="#010803" stroke="#00FF66" stroke-opacity=".3"/>
        
        <!-- Cluster Card 1 -->
        <g transform="translate(18 20)">
          <rect width="144" height="84" rx="8" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
          <rect x="0" y="0" width="3" height="84" rx="1.5" fill="#00FF66"/>
          <text class="p-mono" x="12" y="22" font-size="9" letter-spacing="1.5" fill="#00FF66">LOCAL CLUSTER</text>
          <text class="p-serif" x="12" y="52" font-size="24" font-weight="300" fill="#E6FFF0">0ms</text>
          <text class="p-sans" x="12" y="70" font-size="10" fill="#88B99A">offline UI latency</text>
        </g>
        
        <!-- Cluster Card 2 -->
        <g transform="translate(178 20)">
          <rect width="144" height="84" rx="8" fill="#031609" stroke="#05FFA1" stroke-opacity=".35"/>
          <rect x="0" y="0" width="3" height="84" rx="1.5" fill="#05FFA1"/>
          <text class="p-mono" x="12" y="22" font-size="9" letter-spacing="1.5" fill="#05FFA1">DATA SOVEREIGNTY</text>
          <text class="p-serif" x="12" y="52" font-size="24" font-weight="300" fill="#E6FFF0">100%</text>
          <text class="p-sans" x="12" y="70" font-size="10" fill="#88B99A">air-gapped privacy</text>
        </g>
        
        <!-- Signal / Audio Matrix Waveform -->
        <g transform="translate(18 122)">
          <rect width="304" height="90" rx="8" fill="#020E05" stroke="#00FF66" stroke-opacity=".25"/>
          <path d="M 20 168 L 50 148 L 80 178 L 110 138 L 140 162 L 170 142 L 200 172 L 230 150 L 260 168 L 290 140" fill="none" stroke="#00FF66" stroke-width="1.5"/>
          <text class="p-mono" x="14" y="22" font-size="9" letter-spacing="1.5" fill="#88B99A">MATRIX TELEMETRY CLUSTERS</text>
          <circle cx="290" cy="50" r="4" fill="#05FFA1"/>
        </g>
      </g>
    </g>
    
    <!-- Outer Border & Tracing Edge -->
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#00FF66" stroke-opacity=".2"/>
    <rect class="p-trace" style="animation-delay:0.0s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p03-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>