<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p02-t">
  <title id="p02-t">Myraa AI Assistant: Autonomous multi-modal conversational assistant and desktop agent with streaming tool calling and agentic memory.</title>
  <defs>
    <linearGradient id="p02-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041207"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="p02-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#00FF66" stop-opacity=".45"/>
      <stop offset="1" stop-color="#00240E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p02-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#00FF66" stroke-opacity=".07"/>
    </pattern>
    <filter id="p02-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p02-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p02-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6FFF0"/><stop offset=".45" stop-color="#00FF66"/><stop offset="1" stop-color="#00FF66" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p-in { animation: p-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p-d1 { animation-delay: .15s; } .p-d2 { animation-delay: .4s; }
    .p-chip { animation: p-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p-chip { from { opacity: 0.85; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .p-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p-in { from { opacity: 0.85; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes p-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p-in, .p-chip { animation: none; } .p-draw { animation: none; stroke-dashoffset: 0; } }
    .p-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p-trace 7s linear infinite; }
    @keyframes p-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p-trace { display: none; } }
  </style>
  <g clip-path="url(#p02-clip)">
    <rect width="1200" height="370" fill="url(#p02-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p02-grid)"/>
    <rect width="1200" height="370" fill="url(#p02-glow)"/>
    
    <!-- Left Column Content -->
    <g class="p-in p-d1">
      <text class="p-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#00FF66">02 · AGENTIC AI · LLM ORCHESTRATION</text>
      <text class="p-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#E6FFF0">Myraa AI Assistant</text>
      <text class="p-sans" x="56" y="166" font-size="17" fill="#88B99A">Autonomous multi-modal conversational assistant and desktop agent with streaming tool calling and agentic memory.</text>
      <text class="p-mono" x="56" y="200" font-size="12.5" fill="#E6FFF0"><tspan fill="#00FF66">BUILT ›</tspan> multi-turn dialogue system › type-safe TypeScript runtime › extensible agent toolchains</text>
      <line class="p-draw" x1="56" y1="226" x2="680" y2="226" stroke="#00FF66" stroke-opacity=".3"/>
      
      <!-- 3 Metrics Columns -->
      <g transform="translate(56 266)">
        <text class="p-serif" font-size="34" font-weight="300" fill="#E6FFF0">Multi-Turn</text>
        <text class="p-sans" y="24" font-size="12.5" fill="#88B99A">Autonomous Agent</text>
      </g>
      <g transform="translate(261 266)">
        <text class="p-serif" font-size="34" font-weight="300" fill="#E6FFF0">Type-Safe</text>
        <text class="p-sans" y="24" font-size="12.5" fill="#88B99A">TypeScript Core</text>
      </g>
      <g transform="translate(466 266)">
        <text class="p-serif" font-size="34" font-weight="300" fill="#E6FFF0">Streaming</text>
        <text class="p-sans" y="24" font-size="12.5" fill="#88B99A">Low Latency</text>
      </g>
      
      <!-- Tech Badge Chips -->
      <g class="p-chip" style="animation-delay:1.00s">
        <rect x="56" y="314" width="104" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="108.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">TypeScript</text>
      </g>
      <g class="p-chip" style="animation-delay:1.12s">
        <rect x="170" y="314" width="72" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="206.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">Python</text>
      </g>
      <g class="p-chip" style="animation-delay:1.24s">
        <rect x="252" y="314" width="56" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="280.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">LLMs</text>
      </g>
      <g class="p-chip" style="animation-delay:1.36s">
        <rect x="318" y="314" width="120" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="378.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">Tool Calling</text>
      </g>
      <g class="p-chip" style="animation-delay:1.48s">
        <rect x="448" y="314" width="104" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="500.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">WebSockets</text>
      </g>
      <g class="p-chip" style="animation-delay:1.60s">
        <rect x="562" y="314" width="88" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="606.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">Electron</text>
      </g>
    </g>
    
    <!-- Right Column Illustration -->
    <g class="p-in p-d2">
      <g transform="translate(800 42)">
        <!-- Neural Agent Node Network -->
        <rect width="340" height="230" rx="12" fill="#010803" stroke="#05FFA1" stroke-opacity=".3"/>
        
        <!-- Connecting Beziers -->
        <path d="M 170 115 C 100 115, 80 65, 80 65" fill="none" stroke="#00FF66" stroke-opacity=".4" stroke-dasharray="4 4"/>
        <path d="M 170 115 C 240 115, 260 65, 260 65" fill="none" stroke="#05FFA1" stroke-opacity=".4" stroke-dasharray="4 4"/>
        <path d="M 170 115 C 100 115, 80 175, 80 175" fill="none" stroke="#05FFA1" stroke-opacity=".4" stroke-dasharray="4 4"/>
        <path d="M 170 115 C 240 115, 260 175, 260 175" fill="none" stroke="#00FF66" stroke-opacity=".4" stroke-dasharray="4 4"/>
        
        <!-- Satellite Nodes -->
        <g transform="translate(80 65)">
          <circle r="22" fill="#021408" stroke="#00FF66" stroke-width="1.2"/>
          <text class="p-mono" y="4" text-anchor="middle" font-size="8.5" fill="#00FF66">LLM</text>
        </g>
        <g transform="translate(260 65)">
          <circle r="22" fill="#021408" stroke="#05FFA1" stroke-width="1.2"/>
          <text class="p-mono" y="4" text-anchor="middle" font-size="8.5" fill="#05FFA1">TOOLS</text>
        </g>
        <g transform="translate(80 175)">
          <circle r="22" fill="#021408" stroke="#05FFA1" stroke-width="1.2"/>
          <text class="p-mono" y="4" text-anchor="middle" font-size="8.5" fill="#05FFA1">MEMORY</text>
        </g>
        <g transform="translate(260 175)">
          <circle r="22" fill="#021408" stroke="#00FF66" stroke-width="1.2"/>
          <text class="p-mono" y="4" text-anchor="middle" font-size="8.5" fill="#00FF66">STREAM</text>
        </g>
        
        <!-- Central Agent Core -->
        <g transform="translate(170 115)">
          <circle r="36" fill="#00240E" stroke="#00FF66" stroke-width="1.6"/>
          <circle r="44" fill="none" stroke="#05FFA1" stroke-width="0.8" stroke-dasharray="6 4">
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
          </circle>
          <text class="p-mono" y="-4" text-anchor="middle" font-size="10.5" font-weight="700" fill="#E6FFF0">MYRAA</text>
          <text class="p-mono" y="12" text-anchor="middle" font-size="8.5" fill="#00FF66">AGENT</text>
        </g>
        
        <!-- Bottom Status -->
        <text class="p-mono" x="170" y="218" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="#88B99A">STREAMING WEBSOCKETS · MULTI-TURN AI</text>
      </g>
    </g>
    
    <!-- Outer Border & Tracing Edge -->
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#00FF66" stroke-opacity=".2"/>
    <rect class="p-trace" style="animation-delay:0.0s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p02-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>