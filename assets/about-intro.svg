<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="ab-t ab-d">
  <title id="ab-t">About Pratik Mengal</title>
  <desc id="ab-d">Full-Stack Software Engineer · Cybersecurity Analyst · AI Systems Developer. B.E. Computer Science &amp; Engineering at Dr. D Y Patil Institute of Engineering, Management &amp; Research, Akurdi. Google Cybersecurity Certified (98.81%). Axcentra Software Engineering Trainee.</desc>
  <defs>
    <linearGradient id="ab-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041207"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="ab-glow" cx="80%" cy="20%" r="70%">
      <stop offset="0" stop-color="#00FF66" stop-opacity=".35"/>
      <stop offset="1" stop-color="#00240E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ab-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00FF66" opacity=".025"/>
    </pattern>
  </defs>
  <style>
    .ab-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ab-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ab-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ab-card { animation: ab-in 0.9s cubic-bezier(.16,1,.3,1) both; }
    .ab-fade { animation: ab-fade 1s ease both; }
    @keyframes ab-in { from { opacity: 0.85; transform: translateX(8px); } to { opacity: 1; transform: none; } }
    @keyframes ab-fade { from { opacity: 0.85; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .ab-card, .ab-fade { animation: none; } }
  </style>

  <rect width="1200" height="420" rx="20" fill="url(#ab-bg)"/>
  <rect width="1200" height="420" rx="20" fill="url(#ab-glow)"/>
  <rect x=".5" y=".5" width="1199" height="419" rx="19.5" fill="none" stroke="#00FF66" stroke-opacity=".16"/>

  <!-- Left Column: Terminal window (760x340) -->
  <g class="ab-fade">
    <rect x="40" y="40" width="760" height="340" rx="14" fill="#010803" stroke="#00FF66" stroke-opacity=".25"/>
    <rect x="40" y="40" width="760" height="340" rx="14" fill="url(#ab-scan)"/>
    <path d="M40 54 a14 14 0 0 1 14 -14 H786 a14 14 0 0 1 14 14 V76 H40 Z" fill="#031207"/>
    <line x1="40" y1="76" x2="800" y2="76" stroke="#00FF66" stroke-opacity=".2"/>
    <circle cx="62" cy="58" r="5" fill="#00FF66" fill-opacity=".8"/><circle cx="80" cy="58" r="5" fill="#05FFA1" fill-opacity=".6"/><circle cx="98" cy="58" r="5" fill="#00471B"/>
    <text class="ab-mono" x="420" y="62" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#88B99A">mengalpratik@portfolio: ~</text>
  </g>

  <!-- Interactive Terminal Text -->
  <g class="ab-mono" font-size="13">
    <text x="72" y="128" fill="#00FF66">$ <tspan fill="#E6FFF0">whoami</tspan></text>
    <text x="72" y="153" fill="#00FF66">→ <tspan fill="#88B99A">Pratik Mengal · Full-Stack Engineer · Cybersecurity Analyst</tspan></text>
    <text x="72" y="178" fill="#00FF66">$ <tspan fill="#E6FFF0">cat education.txt</tspan></text>
    <text x="72" y="203" fill="#00FF66">→ <tspan fill="#88B99A">B.E. Computer Science · DYPIEMR, Akurdi, Pune · Graduate 2025</tspan></text>
    <text x="72" y="228" fill="#00FF66">$ <tspan fill="#E6FFF0">cat experience.txt</tspan></text>
    <text x="72" y="253" fill="#00FF66">→ <tspan fill="#88B99A">Axcentra (SWE Trainee) · Devtown (MERN) · Codsoft (Java)</tspan></text>
    <text x="72" y="278" fill="#00FF66">$ <tspan fill="#E6FFF0">ls ./shipped</tspan></text>
    <text x="72" y="303" fill="#00FF66">→ <tspan fill="#88B99A">neuromatrix  myraa-ai  axcentra-modules  neurostore</tspan></text>
    <text x="72" y="328" fill="#00FF66">$ <tspan fill="#E6FFF0">echo $PRINCIPLE</tspan></text>
    <text x="72" y="353" fill="#00FF66">→ <tspan fill="#88B99A">resilient systems · clean abstractions · verified security</tspan></text>
  </g>

  <!-- Terminal Blinking Cursor -->
  <rect x="72" y="364" width="8" height="16" fill="#00FF66">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Right Column: 3 Stacked Cards (324x88 each) -->
  <g class="ab-card" style="animation-delay:1.2s">
    <g transform="translate(836 70)">
      <rect width="324" height="88" rx="14" fill="#020D05" stroke="#00FF66" stroke-opacity=".28"/>
      <rect x="0" y="0" width="3" height="88" rx="1.5" fill="#00FF66"/>
      <text class="ab-mono" x="22" y="26" font-size="10" letter-spacing="2" fill="#00FF66">PRIMARY LANGUAGES</text>
      <text class="ab-serif" x="22" y="58" font-size="28" font-weight="300" fill="#E6FFF0">Java · Python</text>
      <text class="ab-sans" x="22" y="78" font-size="12" fill="#88B99A">DSA practice · OOP &amp; ML pipelines</text>
    </g>
  </g>

  <g class="ab-card" style="animation-delay:1.7s">
    <g transform="translate(836 174)">
      <rect width="324" height="88" rx="14" fill="#020D05" stroke="#00FF66" stroke-opacity=".28"/>
      <rect x="0" y="0" width="3" height="88" rx="1.5" fill="#05FFA1"/>
      <text class="ab-mono" x="22" y="26" font-size="10" letter-spacing="2" fill="#05FFA1">CORE EXPERTISE</text>
      <text class="ab-serif" x="22" y="58" font-size="28" font-weight="300" fill="#E6FFF0">Full-Stack MERN</text>
      <text class="ab-sans" x="22" y="78" font-size="12" fill="#88B99A">React · Node.js · Express · MongoDB</text>
    </g>
  </g>

  <g class="ab-card" style="animation-delay:2.2s">
    <g transform="translate(836 278)">
      <rect width="324" height="88" rx="14" fill="#020D05" stroke="#00FF66" stroke-opacity=".28"/>
      <rect x="0" y="0" width="3" height="88" rx="1.5" fill="#00FF66"/>
      <text class="ab-mono" x="22" y="26" font-size="10" letter-spacing="2" fill="#00FF66">DRAWN TO</text>
      <text class="ab-serif" x="22" y="58" font-size="28" font-weight="300" fill="#E6FFF0">Cyber &amp; AI</text>
      <text class="ab-sans" x="22" y="78" font-size="12" fill="#88B99A">Google Cyber (98.81%) · AI agent systems</text>
    </g>
  </g>
</svg>