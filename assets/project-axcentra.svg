<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p04-t">
  <title id="p04-t">Axcentra Engineering Suite: Enterprise web applications and engineering modules developed during Axcentra software trainee tenure.</title>
  <defs>
    <linearGradient id="p04-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041207"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="p04-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#00FF66" stop-opacity=".45"/>
      <stop offset="1" stop-color="#00240E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p04-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#00FF66" stroke-opacity=".07"/>
    </pattern>
    <filter id="p04-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p04-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p04-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6FFF0"/><stop offset=".45" stop-color="#00FF66"/><stop offset="1" stop-color="#00FF66" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p-in { animation: p-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p-d1 { animation-delay: .15s; } .p-d2 { animation-delay: .4s; }
    .p-chip { animation: p-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p-chip { from { opacity: 0.85; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .p-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p-in { from { opacity: 0.85; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes p-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p-in, .p-chip { animation: none; } .p-draw { animation: none; stroke-dashoffset: 0; } }
    .p-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p-trace 7s linear infinite; }
    @keyframes p-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p-trace { display: none; } }
  </style>
  <g clip-path="url(#p04-clip)">
    <rect width="1200" height="370" fill="url(#p04-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p04-grid)"/>
    <rect width="1200" height="370" fill="url(#p04-glow)"/>
    
    <!-- Left Column Content -->
    <g class="p-in p-d1">
      <text class="p-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#00FF66">04 · ENTERPRISE · WEB DEVELOPMENT</text>
      <text class="p-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#E6FFF0">Axcentra Engineering Suite</text>
      <text class="p-sans" x="56" y="166" font-size="17" fill="#88B99A">Enterprise web applications and engineering modules developed during Axcentra software trainee tenure.</text>
      <text class="p-mono" x="56" y="200" font-size="12.5" fill="#E6FFF0"><tspan fill="#00FF66">BUILT ›</tspan> modular component architecture › automated API integrations › robust enterprise UX</text>
      <line class="p-draw" x1="56" y1="226" x2="680" y2="226" stroke="#00FF66" stroke-opacity=".3"/>
      
      <!-- 3 Metrics Columns -->
      <g transform="translate(56 266)">
        <text class="p-serif" font-size="34" font-weight="300" fill="#E6FFF0">Enterprise</text>
        <text class="p-sans" y="24" font-size="12.5" fill="#88B99A">Weekly Modules</text>
      </g>
      <g transform="translate(261 266)">
        <text class="p-serif" font-size="34" font-weight="300" fill="#E6FFF0">Full-Stack</text>
        <text class="p-sans" y="24" font-size="12.5" fill="#88B99A">JavaScript &amp; Java</text>
      </g>
      <g transform="translate(466 266)">
        <text class="p-serif" font-size="34" font-weight="300" fill="#E6FFF0">REST APIs</text>
        <text class="p-sans" y="24" font-size="12.5" fill="#88B99A">Modern Workflows</text>
      </g>
      
      <!-- Tech Badge Chips -->
      <g class="p-chip" style="animation-delay:1.00s">
        <rect x="56" y="314" width="104" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="108.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">JavaScript</text>
      </g>
      <g class="p-chip" style="animation-delay:1.12s">
        <rect x="170" y="314" width="104" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="222.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">TypeScript</text>
      </g>
      <g class="p-chip" style="animation-delay:1.24s">
        <rect x="284" y="314" width="56" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="312.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">Java</text>
      </g>
      <g class="p-chip" style="animation-delay:1.36s">
        <rect x="350" y="314" width="96" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="398.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">REST APIs</text>
      </g>
      <g class="p-chip" style="animation-delay:1.48s">
        <rect x="456" y="314" width="104" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="508.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">Modern CSS</text>
      </g>
      <g class="p-chip" style="animation-delay:1.60s">
        <rect x="570" y="314" width="48" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="594.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">Git</text>
      </g>
    </g>
    
    <!-- Right Column Illustration -->
    <g class="p-in p-d2">
      <g transform="translate(800 42)">
        <!-- Enterprise Architecture Flow -->
        <rect width="340" height="230" rx="12" fill="#010803" stroke="#00FF66" stroke-opacity=".3"/>
        
        <text class="p-mono" x="20" y="26" font-size="10" letter-spacing="2" fill="#00FF66">ENTERPRISE PIPELINE</text>
        
        <!-- Step 1: Client UI -->
        <g transform="translate(24 46)">
          <rect width="80" height="50" rx="6" fill="#021408" stroke="#00FF66" stroke-opacity=".4"/>
          <text class="p-mono" x="40" y="24" text-anchor="middle" font-size="9" fill="#00FF66">CLIENT</text>
          <text class="p-mono" x="40" y="38" text-anchor="middle" font-size="8" fill="#88B99A">React / Web</text>
        </g>
        
        <path d="M 104 71 H 130" stroke="#00FF66" stroke-width="1.2"/>
        
        <!-- Step 2: REST Gateway -->
        <g transform="translate(130 46)">
          <rect width="80" height="50" rx="6" fill="#00240E" stroke="#05FFA1"/>
          <text class="p-mono" x="40" y="24" text-anchor="middle" font-size="9" font-weight="700" fill="#E6FFF0">GATEWAY</text>
          <text class="p-mono" x="40" y="38" text-anchor="middle" font-size="8" fill="#05FFA1">JWT / RBAC</text>
        </g>
        
        <path d="M 210 71 H 236" stroke="#00FF66" stroke-width="1.2"/>
        
        <!-- Step 3: Backend Services -->
        <g transform="translate(236 46)">
          <rect width="80" height="50" rx="6" fill="#021408" stroke="#00FF66" stroke-opacity=".4"/>
          <text class="p-mono" x="40" y="24" text-anchor="middle" font-size="9" fill="#00FF66">SERVICES</text>
          <text class="p-mono" x="40" y="38" text-anchor="middle" font-size="8" fill="#88B99A">Node / Java</text>
        </g>
        
        <!-- Audit / Specs Bar -->
        <g transform="translate(24 122)">
          <rect width="292" height="88" rx="8" fill="#020E05" stroke="#00FF66" stroke-opacity=".25"/>
          <text class="p-mono" x="16" y="24" font-size="9.5" fill="#E6FFF0">> SWE Trainee Tenure: 2026</text>
          <text class="p-mono" x="16" y="44" font-size="9.5" fill="#88B99A">> Modular Enterprise Web Applications</text>
          <text class="p-mono" x="16" y="64" font-size="9.5" fill="#00FF66">> Rigorous Code Review &amp; Agile Sprints</text>
        </g>
      </g>
    </g>
    
    <!-- Outer Border & Tracing Edge -->
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#00FF66" stroke-opacity=".2"/>
    <rect class="p-trace" style="animation-delay:0.0s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p04-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>