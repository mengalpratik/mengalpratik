          <text class="p-mono" x="28.0" y="16" text-anchor="middle" font-size="10" font-weight="600" fill="#00FF66">Java</text>
        </g>
        <g transform="translate(350.0, 208)">
          <rect width="98.5" height="24" rx="12" fill="#041207" stroke="#00FF66" stroke-width="0.9" stroke-opacity="0.45"/>
          <text class="p-mono" x="49.25" y="16" text-anchor="middle" font-size="10" font-weight="600" fill="#00FF66">REST APIs</text>
        </g>
        <g transform="translate(458.5, 208)">
          <rect width="107.0" height="24" rx="12" fill="#041207" stroke="#00FF66" stroke-width="0.9" stroke-opacity="0.45"/>
          <text class="p-mono" x="53.5" y="16" text-anchor="middle" font-size="10" font-weight="600" fill="#00FF66">Modern CSS</text>
        </g>
        <g transform="translate(575.5, 208)">
          <rect width="47.5" height="24" rx="12" fill="#041207" stroke="#00FF66" stroke-width="0.9" stroke-opacity="0.45"/>
          <text class="p-mono" x="23.75" y="16" text-anchor="middle" font-size="10" font-weight="600" fill="#00FF66">Git</text>
