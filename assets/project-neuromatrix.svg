<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p01-t">
  <title id="p01-t">NeuroMatrix Learning Academy: Full-stack learning &amp; engineering platform delivering a comprehensive 112-day Python engineering curriculum.</title>
  <defs>
    <linearGradient id="p01-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041207"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="p01-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#00FF66" stop-opacity=".45"/>
      <stop offset="1" stop-color="#00240E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p01-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#00FF66" stroke-opacity=".07"/>
    </pattern>
    <filter id="p01-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p01-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p01-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6FFF0"/><stop offset=".45" stop-color="#00FF66"/><stop offset="1" stop-color="#00FF66" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p-in { animation: p-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p-d1 { animation-delay: .15s; } .p-d2 { animation-delay: .4s; }
    .p-chip { animation: p-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p-chip { from { opacity: 0.85; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .p-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p-in { from { opacity: 0.85; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes p-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p-in, .p-chip { animation: none; } .p-draw { animation: none; stroke-dashoffset: 0; } }
    .p-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p-trace 7s linear infinite; }
    @keyframes p-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p-trace { display: none; } }
  </style>
  <g clip-path="url(#p01-clip)">
    <rect width="1200" height="370" fill="url(#p01-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p01-grid)"/>
    <rect width="1200" height="370" fill="url(#p01-glow)"/>
    
    <!-- Left Column Content -->
    <g class="p-in p-d1">
      <text class="p-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#00FF66">01 · FULL-STACK · PYTHON ENGINEERING</text>
      <text class="p-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#E6FFF0">NeuroMatrix Learning Academy</text>
      <text class="p-sans" x="56" y="166" font-size="17" fill="#88B99A">Full-stack learning &amp; engineering platform delivering a comprehensive 112-day Python engineering curriculum.</text>
      <text class="p-mono" x="56" y="200" font-size="12.5" fill="#E6FFF0"><tspan fill="#00FF66">BUILT ›</tspan> modular neural pipelines › automated curriculum progression › real-time telemetry dashboard</text>
      <line class="p-draw" x1="56" y1="226" x2="680" y2="226" stroke="#00FF66" stroke-opacity=".3"/>
      
      <!-- 3 Metrics Columns -->
      <g transform="translate(56 266)">
        <text class="p-serif" font-size="34" font-weight="300" fill="#E6FFF0">112-Day</text>
        <text class="p-sans" y="24" font-size="12.5" fill="#88B99A">Curriculum Roadmap</text>
      </g>
      <g transform="translate(261 266)">
        <text class="p-serif" font-size="34" font-weight="300" fill="#E6FFF0">Full-Stack</text>
        <text class="p-sans" y="24" font-size="12.5" fill="#88B99A">FastAPI &amp; React</text>
      </g>
      <g transform="translate(466 266)">
        <text class="p-serif" font-size="34" font-weight="300" fill="#E6FFF0">Telemetry</text>
        <text class="p-sans" y="24" font-size="12.5" fill="#88B99A">Persisted Progress</text>
      </g>
      
      <!-- Tech Badge Chips -->
      <g class="p-chip" style="animation-delay:1.00s">
        <rect x="56" y="314" width="112" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="112.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">Python 3.13</text>
      </g>
      <g class="p-chip" style="animation-delay:1.12s">
        <rect x="178" y="314" width="80" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="218.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">FastAPI</text>
      </g>
      <g class="p-chip" style="animation-delay:1.24s">
        <rect x="268" y="314" width="64" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="300.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">React</text>
      </g>
      <g class="p-chip" style="animation-delay:1.36s">
        <rect x="342" y="314" width="104" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="394.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">TypeScript</text>
      </g>
      <g class="p-chip" style="animation-delay:1.48s">
        <rect x="456" y="314" width="120" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="516.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">Tailwind CSS</text>
      </g>
      <g class="p-chip" style="animation-delay:1.60s">
        <rect x="586" y="314" width="72" height="26" rx="13" fill="#031609" stroke="#00FF66" stroke-opacity=".35"/>
        <text class="p-mono" x="622.0" y="331" text-anchor="middle" font-size="11.5" fill="#E6FFF0">Docker</text>
      </g>
    </g>
    
    <!-- Right Column Illustration -->
    <g class="p-in p-d2">
      <g transform="translate(800 42)">
        <!-- Terminal Window Frame -->
        <rect width="340" height="230" rx="12" fill="#010803" stroke="#00FF66" stroke-opacity=".35"/>
        <path d="M0 12 a12 12 0 0 1 12 -12 H328 a12 12 0 0 1 12 12 V32 H0 Z" fill="#031407"/>
        <line x1="0" y1="32" x2="340" y2="32" stroke="#00FF66" stroke-opacity=".2"/>
        <circle cx="18" cy="16" r="4.5" fill="#00FF66"/><circle cx="32" cy="16" r="4.5" fill="#05FFA1"/><circle cx="46" cy="16" r="4.5" fill="#00471B"/>
        <text class="p-mono" x="170" y="20" text-anchor="middle" font-size="10.5" fill="#88B99A">neuromatrix://curriculum_core.py</text>
        
        <!-- Code editor lines -->
        <g class="p-mono" font-size="11" fill="#88B99A" transform="translate(20 54)">
          <text y="0"><tspan fill="#05FFA1">class</tspan> <tspan fill="#E6FFF0">NeuroMatrix</tspan>:</text>
          <text y="20">    <tspan fill="#05FFA1">def</tspan> <tspan fill="#00FF66">__init__</tspan>(self, days=112):</text>
          <text y="40">        self.modules = <tspan fill="#E6FFF0">15</tspan></text>
          <text y="60">        self.status = <tspan fill="#00FF66">&quot;PRODUCTION&quot;</tspan></text>
          <text y="90">    <tspan fill="#05FFA1">def</tspan> <tspan fill="#00FF66">execute_curriculum</tspan>(self):</text>
          <text y="110">        <tspan fill="#05FFA1">return</tspan> <tspan fill="#E6FFF0">TelemetryEngine.eval()</tspan></text>
        </g>
        
        <!-- Progress bar -->
        <g transform="translate(20 192)">
          <rect width="300" height="22" rx="6" fill="#00240E" stroke="#00FF66" stroke-opacity=".4"/>
          <rect width="280" height="22" rx="6" fill="#00FF66" fill-opacity=".25"/>
          <text class="p-mono" x="150" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#00FF66">✓ 112 / 112 DAYS COMPLETED · 100%</text>
        </g>
      </g>
    </g>
    
    <!-- Outer Border & Tracing Edge -->
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#00FF66" stroke-opacity=".2"/>
    <rect class="p-trace" style="animation-delay:0.0s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p01-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>