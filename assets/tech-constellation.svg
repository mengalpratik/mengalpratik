<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="tc-title tc-desc">
  <title id="tc-title">Tech stack</title>
  <desc id="tc-desc">Languages: Java (primary), Python, TypeScript, C++. AI, ML and LLM: LLMs, LangChain, PyTorch, Neural Systems. Frontend: React, Next.js, Tailwind CSS, HTML/CSS. Backend and APIs: Node.js, Express, FastAPI, REST, WebSockets, JWT auth. Data and infrastructure: MongoDB, PostgreSQL, Docker, Docker Compose, AWS. Tools and systems: Git, GitHub, Linux, Postman, Agile Scrum.</desc>
  <defs>
    <linearGradient id="tc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#041207"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="tc-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#00FF66" stop-opacity=".3"/>
      <stop offset="1" stop-color="#00240E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tc-pulse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#00FF66" stop-opacity=".6"/>
      <stop offset="1" stop-color="#00FF66" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tc-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6FFF0"/><stop offset=".45" stop-color="#00FF66"/><stop offset="1" stop-color="#00FF66" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .tc-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .tc-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .tc-panel { animation: tc-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .tc-p1 { animation-delay: .05s; } .tc-p2 { animation-delay: .2s; } .tc-p3 { animation-delay: .35s; }
    .tc-p4 { animation-delay: .5s; } .tc-p5 { animation-delay: .65s; } .tc-p6 { animation-delay: .8s; }
    .tc-web { stroke-dasharray: 1800; stroke-dashoffset: 0; animation: tc-draw 3s cubic-bezier(.65,0,.35,1) 1s forwards; }
    @keyframes tc-in { from { opacity: 0.85; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes tc-draw { from { stroke-dashoffset: 1800; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .tc-panel { animation: none; }
      .tc-web { animation: none; stroke-dashoffset: 0; }
    }
    .tc-trace { stroke-dasharray: 201 1120; stroke-dashoffset: 1321; animation: tc-trace 7s linear infinite; }
    @keyframes tc-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .tc-trace { display: none; } }
  </style>

  <rect width="1200" height="500" rx="20" fill="url(#tc-bg)"/>
  <rect width="1200" height="500" rx="20" fill="url(#tc-glow)"/>
  <rect x=".5" y=".5" width="1199" height="499" rx="19.5" fill="none" stroke="#00FF66" stroke-opacity=".16"/>

  <!-- Constellation: gutters linking the six groups -->
  <path class="tc-web" d="M24 250 H1176 M406 24 V476 M794 24 V476" fill="none" stroke="#00FF66" stroke-opacity=".22"/>
  <circle cx="0" cy="250" r="8" fill="url(#tc-pulse)" opacity="0">
    <animate attributeName="cx" values="24;1176" dur="9s" begin="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="9s" begin="3s" repeatCount="indefinite"/>
  </circle>
  <g fill="#010803" stroke="#00FF66">
    <rect x="400" y="244" width="12" height="12" transform="rotate(45 406 250)"/>
    <rect x="788" y="244" width="12" height="12" transform="rotate(45 794 250)"/>
  </g>

  <!-- Row 1: 3 Panels -->
  <g class="tc-panel tc-p1"><g transform="translate(32 32)">
    <rect width="360" height="200" rx="14" fill="#020D05" fill-opacity=".85" stroke="#00FF66" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:0.00s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#00FF66">01  LANGUAGES</text>
    <text class="tc-serif" x="24" y="96" font-size="40" font-weight="300" fill="#E6FFF0">Java <tspan font-size="13" class="tc-mono" fill="#00FF66" dy="-18">PRIMARY</tspan></text>
    <text class="tc-serif" x="24" y="146" font-size="34" font-weight="300" fill="#E6FFF0">Python</text>
    <text class="tc-serif" x="24" y="180" font-size="22" font-weight="300" fill="#88B99A">TypeScript  ·  C++  ·  SQL</text>
  </g></g>

  <g class="tc-panel tc-p2"><g transform="translate(420 32)">
    <rect width="360" height="200" rx="14" fill="#020D05" fill-opacity=".85" stroke="#00FF66" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:-1.15s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#05FFA1">02  CYBERSECURITY &amp; DEFENSE</text>
    <text class="tc-serif" x="24" y="90" font-size="30" font-weight="300" fill="#E6FFF0">Google Cyber 98.81%</text>
    <text class="tc-serif" x="24" y="130" font-size="24" font-weight="300" fill="#E6FFF0">Threat Mitigation</text>
    <text class="tc-serif" x="24" y="164" font-size="22" font-weight="300" fill="#88B99A">SIEM  ·  Network Forensics</text>
    <text class="tc-mono" x="24" y="186" font-size="10" letter-spacing="1.4" fill="#88B99A">INCIDENT RESPONSE · LINUX/SQL</text>
  </g></g>

  <g class="tc-panel tc-p3"><g transform="translate(808 32)">
    <rect width="360" height="200" rx="14" fill="#020D05" fill-opacity=".85" stroke="#00FF66" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:-2.30s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#00FF66">03  FRONTEND</text>
    <text class="tc-serif" x="24" y="96" font-size="40" font-weight="300" fill="#E6FFF0">React</text>
    <text class="tc-serif" x="24" y="140" font-size="26" font-weight="300" fill="#E6FFF0">Next.js  ·  JavaScript</text>
    <text class="tc-serif" x="24" y="176" font-size="22" font-weight="300" fill="#88B99A">Tailwind CSS  ·  HTML5</text>
  </g></g>

  <!-- Row 2: 3 Panels -->
  <g class="tc-panel tc-p4"><g transform="translate(32 268)">
    <rect width="360" height="200" rx="14" fill="#020D05" fill-opacity=".85" stroke="#00FF66" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:-3.45s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#00FF66">04  BACKEND &amp; APIS</text>
    <text class="tc-serif" x="24" y="90" font-size="32" font-weight="300" fill="#E6FFF0">Node.js  ·  Express</text>
    <text class="tc-serif" x="24" y="132" font-size="24" font-weight="300" fill="#E6FFF0">REST APIs  ·  FastAPI</text>
    <text class="tc-serif" x="24" y="170" font-size="22" font-weight="300" fill="#88B99A">JWT Auth  ·  RBAC  ·  Sockets</text>
  </g></g>

  <g class="tc-panel tc-p5"><g transform="translate(420 268)">
    <rect width="360" height="200" rx="14" fill="#020D05" fill-opacity=".85" stroke="#00FF66" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:-4.60s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#05FFA1">05  DATA &amp; INFRASTRUCTURE</text>
    <text class="tc-serif" x="24" y="90" font-size="30" font-weight="300" fill="#E6FFF0">MongoDB  ·  PostgreSQL</text>
    <text class="tc-serif" x="24" y="130" font-size="24" font-weight="300" fill="#E6FFF0">Docker  ·  Compose  ·  AWS</text>
    <text class="tc-serif" x="24" y="166" font-size="22" font-weight="300" fill="#88B99A">MySQL  ·  Redis</text>
    <text class="tc-mono" x="24" y="186" font-size="10" letter-spacing="1.4" fill="#88B99A">DATABASE MODELING · INDEXING</text>
  </g></g>

  <g class="tc-panel tc-p6"><g transform="translate(808 268)">
    <rect width="360" height="200" rx="14" fill="#020D05" fill-opacity=".85" stroke="#00FF66" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:-5.75s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#00FF66">06  TOOLS &amp; SYSTEMS</text>
    <text class="tc-serif" x="24" y="90" font-size="30" font-weight="300" fill="#E6FFF0">Git  ·  GitHub  ·  Linux</text>
    <text class="tc-serif" x="24" y="130" font-size="22" font-weight="300" fill="#E6FFF0">DSA · OOP · DBMS · OS</text>
    <text class="tc-serif" x="24" y="166" font-size="22" font-weight="300" fill="#88B99A">Postman  ·  Agile Scrum  ·  CI/CD</text>
  </g></g>
</svg>